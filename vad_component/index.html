<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<!--
  CRITICAL FIX: Load the official Streamlit component library.
  Without this, Streamlit.setComponentValue() does not exist and audio
  never reaches Python. This was the root cause of the silent failure.
-->
<script src="https://unpkg.com/streamlit-component-lib/dist/StreamlitLib.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --surf:#161921;--border:rgba(255,255,255,.08);
  --txt:#c9d1e0;--muted:#5a6478;
  --green:#3ddc84;--red:#ff4d6a;--amber:#ffb347;--blue:#5b9cf6;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
html,body{background:transparent;color:var(--txt);font-family:var(--sans);font-size:13px;line-height:1.5;padding:4px 2px;overflow-x:hidden}

.sbar{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:9px 14px;margin-bottom:8px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--muted);transition:background .3s}
.dot.idle{background:var(--muted)}
.dot.cal{background:var(--amber);animation:blink 1s infinite}
.dot.listen{background:var(--green)}
.dot.rec{background:var(--red);animation:blink .4s infinite}
.dot.send{background:var(--blue);animation:blink .6s infinite}
.dot.err{background:var(--red)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.stxt{flex:1;font-size:12.5px;font-weight:500}
.rpill{display:none;font-size:10px;font-weight:700;color:var(--red);font-family:var(--mono)}
.rpill.on{display:block}

canvas{display:block;width:100%;height:76px;border-radius:8px;background:var(--surf);border:1px solid var(--border);margin-bottom:8px}

.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.mlbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;display:flex;justify-content:space-between}
.mlbl span{font-family:var(--mono);color:var(--txt)}
.mtrk{height:4px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden}
.mfil{height:100%;border-radius:99px;transition:width .06s;width:0%}
.ce{background:var(--blue)}.cn{background:var(--amber)}.ct{background:var(--red)}

.pbar{height:3px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;margin-bottom:8px;opacity:0;transition:opacity .2s}
.pbar.on{opacity:1}
.pfil{height:100%;background:var(--amber);border-radius:99px;transition:width .1s;width:0%}

.btns{display:flex;gap:8px;margin-bottom:8px}
button{padding:8px 18px;border:none;border-radius:8px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:filter .15s}
#bs{background:var(--green);color:#0a1a10}
#bs:hover:not(:disabled){filter:brightness(1.1)}
#bs:disabled{background:#1e2430;color:var(--muted);cursor:not-allowed}
#bp{background:rgba(255,77,106,.13);color:var(--red);border:1px solid rgba(255,77,106,.3)}
#bp:hover:not(:disabled){background:rgba(255,77,106,.22)}
#bp:disabled{opacity:.4;cursor:not-allowed}

.sent{display:none;font-size:11px;font-family:var(--mono);background:rgba(61,220,132,.08);border:1px solid rgba(61,220,132,.2);border-radius:6px;padding:5px 10px;color:var(--green)}
.sent.on{display:block}
</style>
</head>
<body>

<div class="sbar">
  <div class="dot idle" id="dot"></div>
  <span class="stxt" id="stxt">Click "Start Listening" to begin</span>
  <span class="rpill" id="rp">● REC</span>
</div>

<canvas id="cv"></canvas>

<div class="meters">
  <div>
    <div class="mlbl">Energy <span id="ve">0.0000</span></div>
    <div class="mtrk"><div class="mfil ce" id="fe"></div></div>
  </div>
  <div>
    <div class="mlbl">Noise floor <span id="vn">0.0000</span></div>
    <div class="mtrk"><div class="mfil cn" id="fn"></div></div>
  </div>
  <div>
    <div class="mlbl">Threshold <span id="vt">0.0000</span></div>
    <div class="mtrk"><div class="mfil ct" id="ft"></div></div>
  </div>
</div>

<div class="pbar" id="pb"><div class="pfil" id="pf"></div></div>

<div class="btns">
  <button id="bs" onclick="startL()">🎙️ Start Listening</button>
  <button id="bp" onclick="stopL()" disabled>⏹ Stop</button>
</div>

<div class="sent" id="sent"></div>

<script>
// ── Config defaults (overwritten by Streamlit on render) ──────────────────
let C = {
  calibrationMs:    1500,
  silenceTimeoutMs: 2000,
  energyMultiplier: 2.8,
  minSpeechMs:      400,
  noiseAlpha:       0.97,
  echoCancellation: true,
  noiseSuppression: false,
  autoGainControl:  false,
};

// ── Streamlit component protocol ──────────────────────────────────────────
// 1. Listen for args from Python before declaring ready
document.addEventListener("streamlit:render", ev => {
  if (ev.detail && ev.detail.args) Object.assign(C, ev.detail.args);
  Streamlit.setFrameHeight(document.body.scrollHeight + 12);
});
// 2. Tell Streamlit the component iframe is ready
Streamlit.setComponentReady();
setTimeout(() => Streamlit.setFrameHeight(document.body.scrollHeight + 12), 400);

// ── State ─────────────────────────────────────────────────────────────────
let ctx=null, analyser=null, stream=null, rec=null;
let chunks=[], afId=null;
let isOn=false, isRec=false;
let floor=0.005, t0rec=null, lastSpk=null;
const MAXM=0.6;

// ── DOM ───────────────────────────────────────────────────────────────────
const cv=document.getElementById('cv');
const gx=cv.getContext('2d');
const dot=document.getElementById('dot');
const stxt=document.getElementById('stxt');
const rp=document.getElementById('rp');
const pb=document.getElementById('pb');
const pf=document.getElementById('pf');
const sent=document.getElementById('sent');

function resize(){ cv.width=cv.offsetWidth||640; cv.height=76; }
resize(); window.addEventListener('resize', resize);

// ── Helpers ───────────────────────────────────────────────────────────────
function ss(cls, msg){
  dot.className='dot '+cls; stxt.textContent=msg;
  rp.classList.toggle('on', cls==='rec');
}
function w(v){ return Math.min(v/MAXM*100,100).toFixed(1)+'%'; }

function meters(rms){
  const th=floor*C.energyMultiplier;
  document.getElementById('fe').style.width=w(rms);
  document.getElementById('fn').style.width=w(floor);
  document.getElementById('ft').style.width=w(th);
  document.getElementById('ve').textContent=rms.toFixed(4);
  document.getElementById('vn').textContent=floor.toFixed(4);
  document.getElementById('vt').textContent=th.toFixed(4);
}

function draw(buf){
  const W=cv.width,H=cv.height;
  gx.fillStyle='#161921'; gx.fillRect(0,0,W,H);
  const th=floor*C.energyMultiplier;
  const ty=H/2-Math.min(th,MAXM)/MAXM*(H/2*.85);
  gx.beginPath(); gx.strokeStyle='rgba(255,77,106,.28)';
  gx.lineWidth=1; gx.setLineDash([5,4]);
  gx.moveTo(0,ty); gx.lineTo(W,ty);
  gx.moveTo(0,H-ty); gx.lineTo(W,H-ty);
  gx.stroke(); gx.setLineDash([]);
  gx.beginPath(); gx.strokeStyle='rgba(255,255,255,.06)';
  gx.lineWidth=.5; gx.moveTo(0,H/2); gx.lineTo(W,H/2); gx.stroke();
  gx.beginPath();
  gx.strokeStyle=isRec?'#ff4d6a':'#5b9cf6'; gx.lineWidth=1.5;
  const step=W/buf.length;
  for(let i=0;i<buf.length;i++){
    const x=i*step, y=H/2+buf[i]*(H/2*.85);
    i===0?gx.moveTo(x,y):gx.lineTo(x,y);
  }
  gx.stroke();
}

function rms(){
  const b=new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(b);
  return { buf:b, rms:Math.sqrt(b.reduce((s,v)=>s+v*v,0)/b.length) };
}

// ── Calibration ───────────────────────────────────────────────────────────
function cal(end){
  if(!isOn) return;
  const {buf,rms:r}=rms();
  floor=C.noiseAlpha*floor+(1-C.noiseAlpha)*Math.max(r,0.0002);
  draw(buf); meters(r);
  const rem=Math.max(0,end-Date.now());
  ss('cal',`Calibrating… ${(rem/1000).toFixed(1)}s — stay quiet`);
  if(Date.now()<end){ afId=requestAnimationFrame(()=>cal(end)); }
  else{ ss('listen',`Listening — floor:${floor.toFixed(4)} thresh:${(floor*C.energyMultiplier).toFixed(4)}`); afId=requestAnimationFrame(vad); }
}

// ── VAD loop ──────────────────────────────────────────────────────────────
function vad(){
  if(!isOn) return;
  const {buf,rms:r}=rms();
  draw(buf); meters(r);
  const th=floor*C.energyMultiplier, now=Date.now();

  if(r>th){
    if(!isRec) beginRec();
    lastSpk=now;
    pb.classList.remove('on'); pf.style.width='0%';
    ss('rec',`Recording… energy:${r.toFixed(4)}`);
  } else {
    if(r<th*.55) floor=C.noiseAlpha*floor+(1-C.noiseAlpha)*Math.max(r,0.0002);
    if(isRec && lastSpk!==null){
      const sil=now-lastSpk;
      pb.classList.add('on');
      pf.style.width=Math.min(sil/C.silenceTimeoutMs*100,100).toFixed(1)+'%';
      if(sil>=C.silenceTimeoutMs){
        pb.classList.remove('on'); pf.style.width='0%';
        const dur=now-t0rec;
        dur>=C.minSpeechMs ? endRec() : dropRec(`too short (${dur}ms)`);
      } else {
        const left=((C.silenceTimeoutMs-sil)/1000).toFixed(1);
        ss('rec',`Pause · stopping in ${left}s`);
      }
    } else {
      ss('listen',`Listening — floor:${floor.toFixed(4)} thresh:${(floor*C.energyMultiplier).toFixed(4)}`);
    }
  }
  afId=requestAnimationFrame(vad);
}

// ── Recording ─────────────────────────────────────────────────────────────
function bestMime(){
  for(const m of['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'])
    if(MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
function beginRec(){
  chunks=[];
  const mime=bestMime();
  try{ rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream); }
  catch(e){ rec=new MediaRecorder(stream); }
  rec.ondataavailable=e=>{ if(e.data?.size>0) chunks.push(e.data); };
  rec.onstop=encode;
  rec.start(100);
  isRec=true; t0rec=Date.now(); lastSpk=Date.now();
}
function endRec(){
  if(!isRec) return;
  isRec=false; lastSpk=null;
  ss('send','Encoding audio…');
  rec.stop();
}
function dropRec(why){
  if(!isRec) return;
  isRec=false; lastSpk=null;
  rec.onstop=()=>{};
  rec.stop(); chunks=[];
  ss('listen',`Discarded (${why})`);
  setTimeout(()=>{ if(isOn) ss('listen',`Listening — floor:${floor.toFixed(4)}`); },2000);
}

// ── Encode → Streamlit.setComponentValue ─────────────────────────────────
function encode(){
  if(!chunks.length){ ss('listen','Nothing captured'); return; }
  const mtype=chunks[0].type||'audio/webm';
  const blob=new Blob(chunks,{type:mtype});
  const ext=mtype.includes('ogg')?'ogg':mtype.includes('mp4')?'mp4':'webm';
  const fname=`vad_${Date.now()}.${ext}`;
  chunks=[];

  const reader=new FileReader();
  reader.onloadend=()=>{
    const b64=reader.result.split(',')[1];
    /*
      This is the ONLY correct way to send data back to Streamlit Python.
      Requires streamlit-component-lib loaded above.
      Python receives this as the return value of the declare_component() call.
    */
    Streamlit.setComponentValue({ audio_b64:b64, mime_type:mtype, filename:fname, ts:Date.now() });

    sent.textContent=`✓ Sent to Streamlit: ${fname} (${(blob.size/1024).toFixed(1)} KB)`;
    sent.classList.add('on');
    setTimeout(()=>sent.classList.remove('on'),5000);
    ss('listen','Clip sent — listening for next utterance');
    setTimeout(()=>Streamlit.setFrameHeight(document.body.scrollHeight+12),100);
  };
  reader.readAsDataURL(blob);
}

// ── Public controls ───────────────────────────────────────────────────────
async function startL(){
  document.getElementById('bs').disabled=true;
  ss('cal','Requesting microphone permission…');
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{
      channelCount:1, sampleRate:16000,
      echoCancellation:C.echoCancellation,
      noiseSuppression:C.noiseSuppression,
      autoGainControl:C.autoGainControl,
    }});
  }catch(e){
    ss('err','Mic denied: '+e.message);
    document.getElementById('bs').disabled=false;
    return;
  }
  ctx=new AudioContext({sampleRate:16000});
  analyser=ctx.createAnalyser();
  analyser.fftSize=2048; analyser.smoothingTimeConstant=0.25;
  ctx.createMediaStreamSource(stream).connect(analyser);
  isOn=true; floor=0.005;
  document.getElementById('bp').disabled=false;
  resize();
  afId=requestAnimationFrame(()=>cal(Date.now()+C.calibrationMs));
  Streamlit.setFrameHeight(document.body.scrollHeight+12);
}

function stopL(){
  isOn=false;
  if(afId) cancelAnimationFrame(afId);
  if(isRec&&rec){ isRec=false; rec.onstop=()=>{}; rec.stop(); }
  stream?.getTracks().forEach(t=>t.stop()); stream=null;
  ctx?.close(); ctx=null;
  pb.classList.remove('on');
  document.getElementById('bs').disabled=false;
  document.getElementById('bp').disabled=true;
  ss('idle','Stopped — click "Start Listening" to begin again');
  gx.fillStyle='#161921'; gx.fillRect(0,0,cv.width,cv.height);
  Streamlit.setFrameHeight(document.body.scrollHeight+12);
}

window.addEventListener('beforeunload', stopL);
</script>
</body>
</html>
