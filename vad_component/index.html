<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:        #0d0f14;
    --surface:   #161921;
    --border:    rgba(255,255,255,.07);
    --text:      #c9d1e0;
    --muted:     #5a6478;
    --green:     #3ddc84;
    --red:       #ff4d6a;
    --amber:     #ffb347;
    --blue:      #5b9cf6;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-sans: 'IBM Plex Sans', sans-serif;
  }
  html, body {
    background: transparent;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.5;
    padding: 4px;
    overflow-x: hidden;
  }

  /* Status bar */
  .status-bar {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; margin-bottom: 10px;
  }
  .dot {
    width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0;
    background: var(--muted); transition: background .25s;
  }
  .dot.idle        { background: var(--muted); }
  .dot.calibrating { background: var(--amber); animation: blink 1s infinite; }
  .dot.listening   { background: var(--green); }
  .dot.recording   { background: var(--red);   animation: blink .45s infinite; }
  .dot.sending     { background: var(--blue);  animation: blink .6s  infinite; }
  .dot.error       { background: var(--red); }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .status-text { flex: 1; font-size: 13px; font-weight: 500; }
  .rec-badge {
    display: none; align-items: center; gap: 5px;
    font-size: 11px; color: var(--red); font-family: var(--font-mono);
    font-weight: 500; letter-spacing: .04em;
  }
  .rec-badge.show { display: flex; }

  /* Waveform */
  #waveform {
    display: block; width: 100%; height: 80px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border); margin-bottom: 8px;
  }

  /* Level meters */
  .meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .meter-label {
    font-size: 10px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .06em; margin-bottom: 4px; display: flex; justify-content: space-between;
  }
  .meter-label span { font-family: var(--font-mono); color: var(--text); }
  .meter-track {
    height: 5px; background: rgba(255,255,255,.06);
    border-radius: 99px; overflow: hidden;
  }
  .meter-fill { height: 100%; border-radius: 99px; transition: width .05s linear; width: 0%; }
  #mEnergy .meter-fill { background: var(--blue); }
  #mNoise  .meter-fill { background: var(--amber); }
  #mThresh .meter-fill { background: var(--red); }

  /* Controls */
  .controls { display: flex; gap: 8px; margin-bottom: 10px; }
  button {
    padding: 8px 20px; border: none; border-radius: 8px;
    font-family: var(--font-sans); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .15s; letter-spacing: .02em;
  }
  #btnStart { background: var(--green); color: #0a1a10; }
  #btnStart:hover:not(:disabled) { filter: brightness(1.1); }
  #btnStart:disabled { background: #1e2430; color: var(--muted); cursor: not-allowed; }
  #btnStop {
    background: rgba(255,77,106,.15); color: var(--red);
    border: 1px solid rgba(255,77,106,.35);
  }
  #btnStop:hover:not(:disabled) { background: rgba(255,77,106,.25); }
  #btnStop:disabled { opacity: .4; cursor: not-allowed; }

  /* Pause progress */
  .pause-track {
    height: 3px; background: rgba(255,255,255,.06); border-radius: 99px;
    overflow: hidden; margin-bottom: 10px; opacity: 0; transition: opacity .2s;
  }
  .pause-track.show { opacity: 1; }
  .pause-fill { height: 100%; background: var(--amber); border-radius: 99px; transition: width .1s linear; width: 0%; }

  /* Info strip */
  .info-strip {
    font-size: 11px; color: var(--muted); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
    margin-bottom: 8px; font-family: var(--font-mono);
  }
  .info-strip b { color: var(--blue); }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="status-bar">
  <div class="dot idle" id="dot"></div>
  <span class="status-text" id="statusText">Click "Start Listening" to begin</span>
  <div class="rec-badge" id="recBadge">● REC</div>
</div>

<canvas id="waveform"></canvas>

<div class="meters">
  <div class="meter" id="mEnergy">
    <div class="meter-label">Energy <span id="valEnergy">0.0000</span></div>
    <div class="meter-track"><div class="meter-fill" id="fillEnergy"></div></div>
  </div>
  <div class="meter" id="mNoise">
    <div class="meter-label">Noise floor <span id="valNoise">0.0000</span></div>
    <div class="meter-track"><div class="meter-fill" id="fillNoise"></div></div>
  </div>
  <div class="meter" id="mThresh">
    <div class="meter-label">Threshold <span id="valThresh">0.0000</span></div>
    <div class="meter-track"><div class="meter-fill" id="fillThresh"></div></div>
  </div>
</div>

<div class="pause-track" id="pauseTrack">
  <div class="pause-fill" id="pauseFill"></div>
</div>

<div class="controls">
  <button id="btnStart" onclick="startListening()">🎙️ Start Listening</button>
  <button id="btnStop"  onclick="stopListening()" disabled>⏹ Stop</button>
</div>

<div class="info-strip" id="infoStrip">
  Audio goes <b>browser → Streamlit Python → FastAPI backend</b> — no CORS/HTTPS issues
</div>

<script>
// ── Streamlit component protocol ─────────────────────────────────────────────
// Called once Streamlit sends us our config args
let CONFIG = {
  calibrationMs:    1500,
  silenceTimeoutMs: 2000,
  energyMultiplier: 2.8,
  minSpeechMs:      400,
  noiseAlpha:       0.97,
  echoCancellation: true,
  noiseSuppression: false,
  autoGainControl:  false,
};

function sendToStreamlit(data) {
  // Streamlit component value protocol
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:componentValue",
    value: data
  }, "*");
}

function setFrameHeight(h) {
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:setFrameHeight",
    height: h
  }, "*");
}

// Listen for config from Streamlit
window.addEventListener("message", function(e) {
  if (e.data && e.data.type === "streamlit:render") {
    const args = e.data.args || {};
    Object.assign(CONFIG, args);
  }
});

// Tell Streamlit we're ready
window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
setTimeout(() => setFrameHeight(300), 200);

// ── VAD state ─────────────────────────────────────────────────────────────────
let audioCtx    = null;
let analyser    = null;
let stream      = null;
let mediaRec    = null;
let chunks      = [];
let afId        = null;
let isListening = false;
let isRecording = false;
let noiseFloor  = 0.005;
let speechStart = null;
let lastSpeech  = null;
const MAX_METER = 0.6;

// ── DOM ───────────────────────────────────────────────────────────────────────
const canvas    = document.getElementById('waveform');
const gfx       = canvas.getContext('2d');
const dot       = document.getElementById('dot');
const stText    = document.getElementById('statusText');
const recBadge  = document.getElementById('recBadge');
const pauseTrack = document.getElementById('pauseTrack');
const pauseFill  = document.getElementById('pauseFill');

function resizeCanvas() {
  canvas.width  = canvas.offsetWidth || 600;
  canvas.height = 80;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ── Status ────────────────────────────────────────────────────────────────────
function setStatus(state, msg) {
  dot.className = 'dot ' + state;
  stText.textContent = msg;
  recBadge.classList.toggle('show', state === 'recording');
}

// ── Waveform ──────────────────────────────────────────────────────────────────
function drawWaveform(data) {
  const W = canvas.width, H = canvas.height;
  gfx.clearRect(0, 0, W, H);
  gfx.fillStyle = '#161921';
  gfx.fillRect(0, 0, W, H);

  const thresh = noiseFloor * CONFIG.energyMultiplier;
  const thY = H/2 - Math.min(thresh, MAX_METER)/MAX_METER * (H/2 * 0.85);
  gfx.beginPath();
  gfx.strokeStyle = 'rgba(255,77,106,0.35)';
  gfx.lineWidth = 1;
  gfx.setLineDash([5,4]);
  gfx.moveTo(0, thY); gfx.lineTo(W, thY);
  gfx.moveTo(0, H - thY); gfx.lineTo(W, H - thY);
  gfx.stroke();
  gfx.setLineDash([]);

  gfx.beginPath();
  gfx.strokeStyle = isRecording ? '#ff4d6a' : '#5b9cf6';
  gfx.lineWidth = 1.5;
  const step = W / data.length;
  for (let i = 0; i < data.length; i++) {
    const x = i * step;
    const y = H/2 + data[i] * (H/2 * 0.85);
    i === 0 ? gfx.moveTo(x,y) : gfx.lineTo(x,y);
  }
  gfx.stroke();

  gfx.beginPath();
  gfx.strokeStyle = 'rgba(255,255,255,0.07)';
  gfx.lineWidth = 0.5;
  gfx.moveTo(0, H/2); gfx.lineTo(W, H/2);
  gfx.stroke();
}

// ── Meters ────────────────────────────────────────────────────────────────────
function updateMeters(rms) {
  const thresh = noiseFloor * CONFIG.energyMultiplier;
  const toW = v => Math.min(v / MAX_METER * 100, 100).toFixed(1) + '%';
  document.getElementById('fillEnergy').style.width = toW(rms);
  document.getElementById('fillNoise' ).style.width = toW(noiseFloor);
  document.getElementById('fillThresh').style.width = toW(thresh);
  document.getElementById('valEnergy' ).textContent = rms.toFixed(4);
  document.getElementById('valNoise'  ).textContent = noiseFloor.toFixed(4);
  document.getElementById('valThresh' ).textContent = thresh.toFixed(4);
}

// ── Calibration ───────────────────────────────────────────────────────────────
function getRMS() {
  const data = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(data);
  const rms = Math.sqrt(data.reduce((s,v) => s + v*v, 0) / data.length);
  return { data, rms };
}

function runCalibration(endTime) {
  if (!isListening) return;
  const { data, rms } = getRMS();
  noiseFloor = CONFIG.noiseAlpha * noiseFloor + (1 - CONFIG.noiseAlpha) * Math.max(rms, 0.0002);
  drawWaveform(data);
  updateMeters(rms);
  const rem = Math.max(0, endTime - Date.now());
  setStatus('calibrating', `Calibrating… ${(rem/1000).toFixed(1)}s — stay quiet`);
  if (Date.now() < endTime) {
    afId = requestAnimationFrame(() => runCalibration(endTime));
  } else {
    setStatus('listening', `Listening — floor: ${noiseFloor.toFixed(4)} · thresh: ${(noiseFloor * CONFIG.energyMultiplier).toFixed(4)}`);
    afId = requestAnimationFrame(runVAD);
  }
}

// ── VAD loop ──────────────────────────────────────────────────────────────────
function runVAD() {
  if (!isListening) return;
  const { data, rms } = getRMS();
  drawWaveform(data);
  updateMeters(rms);

  const thresh = noiseFloor * CONFIG.energyMultiplier;
  const now = Date.now();

  if (rms > thresh) {
    if (!isRecording) beginRecording();
    lastSpeech = now;
    pauseTrack.classList.remove('show');
    pauseFill.style.width = '0%';
    setStatus('recording', `Recording…  energy: ${rms.toFixed(4)}`);
  } else {
    if (rms < thresh * 0.55) {
      noiseFloor = CONFIG.noiseAlpha * noiseFloor + (1 - CONFIG.noiseAlpha) * Math.max(rms, 0.0002);
    }
    if (isRecording && lastSpeech !== null) {
      const silenceMs = now - lastSpeech;
      const pct = Math.min(silenceMs / CONFIG.silenceTimeoutMs * 100, 100);
      pauseTrack.classList.add('show');
      pauseFill.style.width = pct.toFixed(1) + '%';
      if (silenceMs >= CONFIG.silenceTimeoutMs) {
        pauseTrack.classList.remove('show');
        pauseFill.style.width = '0%';
        const duration = now - speechStart;
        if (duration >= CONFIG.minSpeechMs) {
          finishRecording();
        } else {
          discardRecording(`too short (${duration}ms)`);
        }
      } else {
        const left = ((CONFIG.silenceTimeoutMs - silenceMs) / 1000).toFixed(1);
        setStatus('recording', `Pause · stopping in ${left}s`);
      }
    } else {
      setStatus('listening', `Listening — floor: ${noiseFloor.toFixed(4)} · thresh: ${(noiseFloor * CONFIG.energyMultiplier).toFixed(4)}`);
    }
  }
  afId = requestAnimationFrame(runVAD);
}

// ── Recording ─────────────────────────────────────────────────────────────────
function getMime() {
  for (const m of ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/ogg','audio/mp4']) {
    if (MediaRecorder.isTypeSupported(m)) return m;
  }
  return '';
}

function beginRecording() {
  chunks = [];
  const mime = getMime();
  try { mediaRec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
  catch(e) { mediaRec = new MediaRecorder(stream); }
  mediaRec.ondataavailable = e => { if (e.data?.size > 0) chunks.push(e.data); };
  mediaRec.onstop = encodeAndSend;
  mediaRec.start(80);
  isRecording = true;
  speechStart = Date.now();
  lastSpeech  = Date.now();
}

function finishRecording() {
  if (!isRecording) return;
  isRecording = false;
  lastSpeech  = null;
  setStatus('sending', 'Sending to Streamlit…');
  mediaRec.stop();
}

function discardRecording(reason) {
  if (!isRecording) return;
  isRecording = false;
  lastSpeech  = null;
  mediaRec.onstop = () => {};
  mediaRec.stop();
  chunks = [];
  setStatus('listening', `Discarded (${reason})`);
  setTimeout(() => {
    if (isListening) setStatus('listening', `Listening — floor: ${noiseFloor.toFixed(4)}`);
  }, 1800);
}

// ── Encode → send to Streamlit Python ────────────────────────────────────────
function encodeAndSend() {
  if (!chunks.length) {
    setStatus('listening', 'Nothing captured');
    return;
  }
  const blob = new Blob(chunks, { type: chunks[0].type || 'audio/webm' });
  const ext  = blob.type.includes('ogg') ? 'ogg' : blob.type.includes('mp4') ? 'mp4' : 'webm';
  const filename = `vad_${Date.now()}.${ext}`;
  chunks = [];

  const reader = new FileReader();
  reader.onloadend = () => {
    // base64 string after the data URL prefix
    const b64 = reader.result.split(',')[1];
    // Send to Streamlit Python — Python will proxy to FastAPI
    sendToStreamlit({
      audio_b64: b64,
      mime_type: blob.type,
      filename:  filename,
      ts:        Date.now()
    });
    setStatus('sending', 'Sent to backend — waiting for transcription…');
  };
  reader.readAsDataURL(blob);
}

// ── Start/Stop ────────────────────────────────────────────────────────────────
async function startListening() {
  document.getElementById('btnStart').disabled = true;
  setStatus('calibrating', 'Requesting microphone…');
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount:     1,
        sampleRate:       16000,
        echoCancellation:  CONFIG.echoCancellation,
        noiseSuppression:  CONFIG.noiseSuppression,
        autoGainControl:   CONFIG.autoGainControl,
      }
    });
  } catch(err) {
    setStatus('error', 'Mic denied: ' + err.message);
    document.getElementById('btnStart').disabled = false;
    return;
  }
  audioCtx = new AudioContext({ sampleRate: 16000 });
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.25;
  audioCtx.createMediaStreamSource(stream).connect(analyser);
  isListening = true;
  noiseFloor  = 0.005;
  document.getElementById('btnStop').disabled = false;
  resizeCanvas();
  const calEnd = Date.now() + CONFIG.calibrationMs;
  afId = requestAnimationFrame(() => runCalibration(calEnd));
}

function stopListening() {
  isListening = false;
  if (afId) cancelAnimationFrame(afId);
  if (isRecording && mediaRec) { isRecording = false; mediaRec.onstop = () => {}; mediaRec.stop(); }
  stream?.getTracks().forEach(t => t.stop()); stream = null;
  audioCtx?.close(); audioCtx = null;
  pauseTrack.classList.remove('show');
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnStop').disabled  = true;
  setStatus('idle', 'Stopped — click "Start Listening" to begin again');
  gfx.fillStyle = '#161921';
  gfx.fillRect(0,0,canvas.width,canvas.height);
}

window.addEventListener('beforeunload', stopListening);
</script>
</body>
</html>
